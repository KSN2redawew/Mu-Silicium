name: DIZI native EDK2 / Arch self-hosted
# No timer; only this development branch or an explicit manual request.
on:
  push:
    branches:
      - dizi/native-pmic-buttons-20261025
    paths:
      - "Platforms/Xiaomi/DiziBootPkg/**"
      - "Platforms/Xiaomi/diziPkg/**"
      - "tools/test_dizi_native_integration.py"
      - "tools/verify_dizi_native_fv.py"
      - "tools/verify_dizi_fd_boot_pair.py"
      - ".github/workflows/dizi-native-edk2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dizi-native-edk2
  cancel-in-progress: true

jobs:
  native-dizi:
    name: Native DIZI EDK2 on Arch x86_64
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check Arch Linux toolchain
        run: |
          set -euo pipefail
          if ! grep -qx 'ID=arch' /etc/os-release && ! grep -Eq '^ID_LIKE=.*arch' /etc/os-release; then
            echo "::error::Arch Linux runner is required."
            exit 1
          fi
          for b in python3 git clang llvm-lib lld-link nasm mono make aarch64-linux-gnu-gcc pkg-config sha256sum; do
            command -v "$b" >/dev/null || { echo "::error::Missing tool $b"; exit 1; }
          done

      - name: Verify native dizi wiring and safety
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_dizi_native_integration.py' -v
          python3 -m py_compile tools/verify_dizi_native_fv.py tools/verify_dizi_fd_boot_pair.py

      - name: Build native dizi without overlay
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r pip-requirements.txt
          source .venv/bin/activate
          python3 build_uefi.py -d dizi -r RELEASE -c 2>&1 | tee dizi-native-build.log
          test -s Mu-dizi.img
          test -s Build/diziPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd

      - name: Verify exact FD and compiled selector
        run: |
          set -euo pipefail
          mkdir -p dist
          boot="dist/Mu-dizi-R4-native-${GITHUB_RUN_ID}.img"
          fd="dist/SILICIUM_UEFI-dizi-R4-native-${GITHUB_RUN_ID}.fd"
          cp Mu-dizi.img "$boot"
          cp Build/diziPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd "$fd"
          python3 tools/verify_dizi_fd_boot_pair.py "$boot" "$fd" --report dist/FD_MATCH.json
          python3 tools/verify_dizi_native_fv.py "$boot" --require-selector-string R4-MU-NATIVE --report dist/SELECTOR_FV.json
          (cd dist && sha256sum *.img *.fd > SHA256SUMS.txt)
          printf 'Experimental dizi-only firmware. fastboot boot ONLY, never fastboot flash. Button Power/Down GEN3 correction not yet hardware verified. Android/XNU EFI loaders unavailable.\n' > dist/README.txt

      - name: Save artifacts locally on Arch
        if: always()
        run: |
          mkdir -p "$HOME/dizi-native-edk2/${GITHUB_RUN_ID}"
          if [ -d dist ]; then cp -a dist/. "$HOME/dizi-native-edk2/${GITHUB_RUN_ID}/"; fi
          if [ -f dizi-native-build.log ]; then cp dizi-native-build.log "$HOME/dizi-native-edk2/${GITHUB_RUN_ID}/"; fi

      - name: Upload artifacts (quota permitting)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dizi-native-r4-${{ github.run_id }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14
